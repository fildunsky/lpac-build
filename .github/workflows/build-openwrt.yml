name: Build lpac for OpenWrt

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.release }} ${{ matrix.target }}/${{ matrix.subtarget }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- OpenWrt 25.12.5 (apk-based, gcc-14.3.0) --------------------------
          - { release: "25.12.5", target: mediatek, subtarget: filogic, sdk: mediatek-filogic_gcc-14.3.0_musl }
          - { release: "25.12.5", target: rockchip, subtarget: armv8,   sdk: rockchip-armv8_gcc-14.3.0_musl }
          - { release: "25.12.5", target: bcm27xx,  subtarget: bcm2711, sdk: bcm27xx-bcm2711_gcc-14.3.0_musl }
          - { release: "25.12.5", target: armsr,    subtarget: armv8,   sdk: armsr-armv8_gcc-14.3.0_musl }
          - { release: "25.12.5", target: armsr,    subtarget: armv7,   sdk: armsr-armv7_gcc-14.3.0_musl_eabi }
          - { release: "25.12.5", target: ramips,   subtarget: mt7621,  sdk: ramips-mt7621_gcc-14.3.0_musl }
          - { release: "25.12.5", target: ath79,    subtarget: generic, sdk: ath79-generic_gcc-14.3.0_musl }
          - { release: "25.12.5", target: x86,      subtarget: "64",    sdk: x86-64_gcc-14.3.0_musl }
          # ---- OpenWrt 24.10.7 (opkg/ipk-based, gcc-13.3.0) ---------------------
          # .7, not the day-old .8: give the release servers time to settle.
          - { release: "24.10.7", target: mediatek, subtarget: filogic, sdk: mediatek-filogic_gcc-13.3.0_musl }
          - { release: "24.10.7", target: rockchip, subtarget: armv8,   sdk: rockchip-armv8_gcc-13.3.0_musl }
          - { release: "24.10.7", target: bcm27xx,  subtarget: bcm2711, sdk: bcm27xx-bcm2711_gcc-13.3.0_musl }
          - { release: "24.10.7", target: armsr,    subtarget: armv8,   sdk: armsr-armv8_gcc-13.3.0_musl }
          - { release: "24.10.7", target: armsr,    subtarget: armv7,   sdk: armsr-armv7_gcc-13.3.0_musl_eabi }
          - { release: "24.10.7", target: ramips,   subtarget: mt7621,  sdk: ramips-mt7621_gcc-13.3.0_musl }
          - { release: "24.10.7", target: ath79,    subtarget: generic, sdk: ath79-generic_gcc-13.3.0_musl }
          - { release: "24.10.7", target: x86,      subtarget: "64",    sdk: x86-64_gcc-13.3.0_musl }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk gettext git \
            libncurses-dev libssl-dev python3 unzip wget zstd file

      - name: Download OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets"
          URL="${BASE}/${{ matrix.target }}/${{ matrix.subtarget }}/openwrt-sdk-${{ matrix.release }}-${{ matrix.sdk }}.Linux-x86_64.tar.zst"
          echo "Downloading $URL"
          curl -fL --connect-timeout 30 --retry 3 -o /tmp/sdk.tar.zst "$URL"

      - name: Extract SDK
        run: |
          mkdir -p /tmp/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /tmp/sdk --strip-components=1
          rm /tmp/sdk.tar.zst

      - name: Install lpac package definition into SDK
        run: |
          mkdir -p /tmp/sdk/package/lpac
          cp -r openwrt/* /tmp/sdk/package/lpac/
          echo "Package files:"
          find /tmp/sdk/package/lpac -type f | sort

      - name: Update feeds and compile lpac
        run: |
          cd /tmp/sdk
          # Use the SDK's own feeds.conf.default (pinned to this release: openwrt-25.12
          # or openwrt-24.10). Writing our own ref would point at a non-existent branch.
          cp feeds.conf.default feeds.conf
          # Native QMI/MBIM backends need libqmi/libmbim, which pull glib2; glib2 in
          # turn needs its target deps (zlib/pcre2/libffi/...) BUILT for the target.
          # Installing only 'uqmi' left those uninstalled, so glib2 linked the host
          # libz.a into the target (wrong arch) and failed.
          # 'feeds install -a' fixed glib2 but was too broad: it also pulled perl/
          # uboot (host prereq checks fail on some targets -> rockchip broke). Install
          # ONLY what we need instead - feeds resolves each package's deps recursively,
          # so libqmi/libmbim drag in glib2 + zlib/pcre2/libffi for the target, giving
          # the same glib2 fix without the collateral packages.
          ./scripts/feeds update -a
          # The 24.10 packages feed ships its OWN lpac; our patched build lives in
          # package/lpac, and two packages named 'lpac' break defconfig with
          # "glob failed: No files found .../lpac/Config.in". Drop every lpac the feeds
          # provide (dir + any install symlink) and rebuild the feed index so ours is
          # the only definition. 25.12 has no feed lpac, so this is a harmless no-op there.
          find feeds -path '*/lpac' -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf package/feeds/*/lpac 2>/dev/null || true
          ./scripts/feeds update -i
          ./scripts/feeds install uqmi libqmi libmbim
          echo "CONFIG_PACKAGE_lpac=m" >> .config
          echo "CONFIG_LPAC_WITH_AT=y" >> .config
          echo "CONFIG_LPAC_WITH_QMI=y" >> .config
          echo "CONFIG_LPAC_WITH_UQMI=y" >> .config
          echo "CONFIG_LPAC_WITH_MBIM=y" >> .config
          echo "# CONFIG_LPAC_WITH_PCSC is not set" >> .config
          # libqmi ships three message "collections": minimal < basic < full. lpac's
          # native QMI driver calls the UIM open/close-logical-channel messages, which
          # exist ONLY in the FULL collection. defconfig otherwise picks basic, so the
          # build reached driver/apdu/qmi_common.c and failed with a wall of "implicit
          # declaration of qmi_message_uim_open_logical_channel_*". ('feeds install -a'
          # masked this because it pulled modemmanager, which forces libqmi to full.)
          # libmbim has no such split - it always builds the full message set.
          echo "CONFIG_LIBQMI_COLLECTION_FULL=y" >> .config
          echo "# CONFIG_LIBQMI_COLLECTION_BASIC is not set" >> .config
          echo "# CONFIG_LIBQMI_COLLECTION_MINIMAL is not set" >> .config
          make defconfig
          # Guard: fail loudly if defconfig did not settle on the full collection
          # (otherwise the qmi_common.c wall of errors returns 15 minutes later).
          grep -q '^CONFIG_LIBQMI_COLLECTION_FULL=y' .config || {
            echo "ERROR: libqmi did not resolve to FULL collection"; grep LIBQMI_COLLECTION .config; exit 1; }
          make package/lpac/compile V=s -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # Filenames carry no arch; tag with release+platform so nothing collides
          # in the Release (25.12.5 -> .apk, 24.10.7 -> .ipk).
          i=0
          for f in $(find /tmp/sdk/bin -name 'lpac*.apk' -o -name 'lpac*.ipk'); do
            ext="${f##*.}"
            cp "$f" "artifacts/lpac-fm350-${{ matrix.release }}-${{ matrix.target }}-${{ matrix.subtarget }}.${ext}"
            i=$((i+1))
          done
          echo "Built ($i files):"; ls -la artifacts/
          test "$i" -gt 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lpac-${{ matrix.release }}-${{ matrix.target }}-${{ matrix.subtarget }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          mkdir -p release
          find dist -type f \( -name '*.apk' -o -name '*.ipk' \) -exec cp {} release/ \;
          ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          body: |
            Patched lpac 2.3.x (source: fildunsky/lpac) built for OpenWrt 25.12.5 (`.apk`)
            and 24.10.7 (`.ipk`).
            Native AT driver (PRs #446/#447/#448 + FM350 bare-CCHO #449) + LPAC_DRIVER_HOME loader fix.
            APDU backends: AT + UQMI + stdio. AT covers Fibocom FM350-GL; UQMI covers
            Qualcomm SDX55 (Foxconn T99W175 / Thales MV31-W / Dell DW5930e) in a QMI
            composition (via the uqmi CLI). Native QMI/MBIM (libqmi/libmbim) are off -
            glib2 does not cross-build in the OpenWrt SDK (host-lib leak); see README.
            Install: 25.12.x `apk add --allow-untrusted <file>.apk`;
            24.10.x `opkg install <file>.ipk`.
